<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">How the DarkSol red team traces a withdrawal</title>
  <desc id="desc">Continuously, DarkSol indexes every Privacy Cash and Cloak pool transaction on Solana, replays each pool from its first note, and verifies the replay against on-chain proofs and the live pool. For each trace, a pasted withdrawal is matched to every note that could have paid for it, linking rules are applied to the depositor wallets, and a report is produced with a verdict, likely sources, public clues and limits.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#a3a3a3"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#ffc53d"/>
    </marker>
  </defs>
  <style>
    .step { fill: #ededed; font-size: 13px; font-weight: 600; }
    .num { fill: #ffc53d; font-weight: 700; }
    .detail { fill: #a3a3a3; font-size: 11.5px; }
    .phase { fill: #ffc53d; font-size: 10px; font-weight: 600; letter-spacing: .12em; }
    .halo { paint-order: stroke; stroke: #0b0b0b; stroke-width: 6px; stroke-linejoin: round; }
    .box { fill: #141414; stroke: #383838; }
    .box-accent { fill: #12110d; stroke: #ffc53d; }
    .flow { stroke: #a3a3a3; stroke-width: 1.4; fill: none; }
    .flow-accent { stroke: #ffc53d; stroke-width: 1.4; fill: none; }
  </style>

  <rect width="880" height="420" rx="10" fill="#0b0b0b"/>
  <rect x=".5" y=".5" width="879" height="419" rx="10" fill="none" stroke="#242424"/>

  <!-- Phase labels -->
  <text class="phase" x="20" y="34">ALWAYS RUNNING</text>
  <text class="phase" x="20" y="214">FOR EACH TRACE</text>

  <g text-anchor="middle">
    <!-- Row A: background indexing -->
    <rect class="box" x="20" y="48" width="192" height="90" rx="6"/>
    <text class="step" x="116" y="78">Solana</text>
    <text class="detail" x="116" y="100">Privacy Cash · Cloak pools</text>
    <text class="detail" x="116" y="116">SOL · USDC · USDT</text>

    <rect class="box" x="236" y="48" width="192" height="90" rx="6"/>
    <text class="step" x="332" y="78"><tspan class="num">1 </tspan>Index</text>
    <text class="detail" x="332" y="100">every deposit, withdrawal</text>
    <text class="detail" x="332" y="116">and note in each pool</text>

    <rect class="box" x="452" y="48" width="192" height="90" rx="6"/>
    <text class="step" x="548" y="78"><tspan class="num">2 </tspan>Replay</text>
    <text class="detail" x="548" y="100">rebuild each pool</text>
    <text class="detail" x="548" y="116">from its first note</text>

    <rect class="box" x="668" y="48" width="192" height="90" rx="6"/>
    <text class="step" x="764" y="78"><tspan class="num">3 </tspan>Verify</text>
    <text class="detail" x="764" y="100">match on-chain proof roots</text>
    <text class="detail" x="764" y="116">and the live pool account</text>

    <!-- Row B: per trace -->
    <rect class="box-accent" x="20" y="228" width="192" height="90" rx="6" stroke-dasharray="4 3"/>
    <text class="step" x="116" y="258">You</text>
    <text class="detail" x="116" y="280">paste a withdrawal</text>
    <text class="detail" x="116" y="296">signature or Solscan link</text>

    <rect class="box" x="236" y="228" width="192" height="90" rx="6"/>
    <text class="step" x="332" y="258"><tspan class="num">4 </tspan>Possible sources</text>
    <text class="detail" x="332" y="280">every note in the pool</text>
    <text class="detail" x="332" y="296">when its proof was made</text>

    <rect class="box" x="452" y="228" width="192" height="90" rx="6"/>
    <text class="step" x="548" y="258"><tspan class="num">5 </tspan>Link</text>
    <text class="detail" x="548" y="280">apply linking rules</text>
    <text class="detail" x="548" y="296">to depositor wallets</text>

    <rect class="box-accent" x="668" y="228" width="192" height="90" rx="6"/>
    <text class="step" x="764" y="258"><tspan class="num">6 </tspan>Report</text>
    <text class="detail" x="764" y="280">verdict · likely sources</text>
    <text class="detail" x="764" y="296">public clues · limits</text>
  </g>

  <!-- Row A arrows -->
  <line class="flow" x1="212" y1="93" x2="234" y2="93" marker-end="url(#arrow)"/>
  <line class="flow" x1="428" y1="93" x2="450" y2="93" marker-end="url(#arrow)"/>
  <line class="flow" x1="644" y1="93" x2="666" y2="93" marker-end="url(#arrow)"/>

  <!-- Verified history feeds each trace -->
  <path class="flow" d="M764 138 V178 H332 V226" marker-end="url(#arrow)"/>
  <text class="detail halo" x="548" y="182" text-anchor="middle">verified pool history</text>

  <!-- Row B arrows -->
  <line class="flow-accent" x1="212" y1="273" x2="234" y2="273" marker-end="url(#arrow-accent)"/>
  <line class="flow-accent" x1="428" y1="273" x2="450" y2="273" marker-end="url(#arrow-accent)"/>
  <line class="flow-accent" x1="644" y1="273" x2="666" y2="273" marker-end="url(#arrow-accent)"/>

  <!-- Key -->
  <rect x="20" y="350" width="840" height="50" rx="6" fill="#12110d" stroke="#2d2716"/>
  <rect x="38" y="369" width="12" height="12" rx="2" fill="none" stroke="#ffc53d" stroke-dasharray="3 2"/>
  <text x="62" y="379" class="detail"><tspan fill="#ededed" font-weight="550">Public data only:</tspan> the trace reads what anyone can see on Solana, the same view an outside analyst has.</text>
</svg>
